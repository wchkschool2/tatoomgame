<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมเก็บขยะออนไลน์ (Multiplayer with Supabase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #1a202c;
            color: white;
            overflow: hidden; 
            touch-action: none; 
        }
        #gameCanvas {
            display: none; 
            background-color: #2d3748;
            cursor: crosshair;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <div id="loginScreen" class="absolute inset-0 flex flex-col items-center justify-center z-10 glass-panel m-4 md:m-20 p-8 shadow-2xl">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-green-400 drop-shadow-md text-center">♻️ Eco Collector ♻️</h1>
        
        <div class="w-full max-w-md flex gap-2">
            <input type="text" id="playerNameInput" placeholder="ตั้งชื่อตัวละครของคุณ..." class="w-full px-4 py-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-green-500 text-center text-xl" maxlength="12">
            <button id="joinButton" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg shrink-0">
                เข้าเกม 🚀
            </button>
        </div>
    </div>

    <canvas id="gameCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>

    <div id="uiOverlay" class="absolute top-0 left-0 w-full h-full pointer-events-none hidden z-20">
        <div class="absolute top-4 left-4 glass-panel p-3 pointer-events-auto">
            <div class="font-bold text-lg text-blue-300" id="myPlayerName">Player</div>
            <div class="text-xl">คะแนน: <span id="myPlayerScore" class="font-bold text-yellow-400">0</span></div>
        </div>

        <div class="absolute top-4 right-4 glass-panel p-3 w-48 pointer-events-auto">
            <h3 class="font-bold text-green-400 border-b border-gray-500 mb-2 pb-1">🏆 Leaderboard</h3>
            <ul id="leaderboardList" class="text-sm space-y-1"></ul>
        </div>
    </div>

    <script>
        // --- ตัวแปรระบบ ---
        let supabaseClient = null;
        let gameChannel = null;
        
        let isGameRunning = false;
        let myId = crypto.randomUUID(); // สร้าง ID จำลองให้ผู้เล่น
        let myPlayer = null; 
        let otherPlayers = {}; 
        let trashItems = {}; 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight;

        // ข้อมูลตัวละครและขยะ
        const characterIcons = ['👶', '👧', '👦', '🧑', '👨', '👩', '🦸‍♂️', '🦸‍♀️', '🧙‍♂️', '🤖', '👽', '👻'];
        const trashTypes = [
            { icon: '🥤', value: 10, name: 'แก้วพลาสติก' },
            { icon: '📄', value: 5, name: 'กระดาษ' },
            { icon: '🥫', value: 15, name: 'กระป๋อง' },
            { icon: '🛍️', value: 20, name: 'ถุงพลาสติก' }
        ];

        // --- ระบบจอและควบคุม ---
        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let targetX = null, targetY = null;
        const playerSpeed = 6;

        window.addEventListener('keydown', (e) => { if(isGameRunning && keys.hasOwnProperty(e.key)) keys[e.key] = true; targetX = null; targetY = null; });
        window.addEventListener('keyup', (e) => { if(isGameRunning && keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        
        canvas.addEventListener('pointerdown', (e) => { if(isGameRunning) { targetX = e.clientX; targetY = e.clientY; }});
        canvas.addEventListener('pointermove', (e) => { if(isGameRunning && e.buttons === 1) { targetX = e.clientX; targetY = e.clientY; }});

        // --- ระบบ Supabase Realtime (หัวใจสำคัญ) ---
        async function setupSupabase(url, key) {
            try {
                // สร้างการเชื่อมต่อ (เปลี่ยนชื่อตัวแปรเป็น supabaseClient เพื่อไม่ให้ซ้ำ)
                supabaseClient = window.supabase.createClient(url, key);
                
                // สร้างห้องสนทนา (Channel) ชื่อ 'game-room'
                gameChannel = supabaseClient.channel('game-room', {
                    config: { broadcast: { self: false } } // ไม่ต้องรับข้อความของตัวเอง
                });

                // ดักรอข้อความจากผู้เล่นคนอื่น
                gameChannel.on('broadcast', { event: 'player_moved' }, (payload) => {
                    const data = payload.payload;
                    // ถ้ายังไม่มีข้อมูลคนนี้ ให้สร้างใหม่ ถ้ามีแล้วให้อัปเดต
                    if(!otherPlayers[data.id]) otherPlayers[data.id] = {};
                    otherPlayers[data.id] = { ...otherPlayers[data.id], ...data };
                    otherPlayers[data.id].lastUpdate = Date.now();
                });

                gameChannel.on('broadcast', { event: 'trash_spawned' }, (payload) => {
                    const data = payload.payload;
                    trashItems[data.id] = data;
                });

                gameChannel.on('broadcast', { event: 'trash_collected' }, (payload) => {
                    const data = payload.payload;
                    delete trashItems[data.trashId]; // ลบขยะเมื่อมีคนบอกว่าเก็บแล้ว
                });

                gameChannel.on('broadcast', { event: 'score_update' }, (payload) => {
                    const data = payload.payload;
                    if(otherPlayers[data.id]) {
                        otherPlayers[data.id].score = data.score;
                        updateLeaderboard();
                    }
                });

                // เข้าร่วมห้อง
                await gameChannel.subscribe();
                return true;
            } catch (error) {
                console.error("Supabase Error:", error);
                return false;
            }
        }

        // --- ระบบเกมเพลย์ ---
        function updateGameLogic() {
            if (!myPlayer) return;

            let isMoving = false;
            let moveX = 0, moveY = 0;

            if (keys.w || keys.ArrowUp) moveY -= playerSpeed;
            if (keys.s || keys.ArrowDown) moveY += playerSpeed;
            if (keys.a || keys.ArrowLeft) moveX -= playerSpeed;
            if (keys.d || keys.ArrowRight) moveX += playerSpeed;

            if (targetX !== null && targetY !== null && moveX === 0 && moveY === 0) {
                const dx = targetX - myPlayer.x;
                const dy = targetY - myPlayer.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > playerSpeed) { moveX = (dx / dist) * playerSpeed; moveY = (dy / dist) * playerSpeed; } 
                else { myPlayer.x = targetX; myPlayer.y = targetY; targetX = null; targetY = null; }
            }

            if (moveX !== 0 || moveY !== 0) {
                myPlayer.x = Math.max(30, Math.min(canvasWidth - 30, myPlayer.x + moveX));
                myPlayer.y = Math.max(30, Math.min(canvasHeight - 30, myPlayer.y + moveY));
                isMoving = true;
            }

            // ส่งข้อมูลพิกัดไปให้คนอื่น (Broadcast) ประมาณ 10 ครั้งต่อวินาที
            if (isMoving && Date.now() - myPlayer.lastSendTime > 100) {
                if (gameChannel) {
                    gameChannel.send({
                        type: 'broadcast',
                        event: 'player_moved',
                        payload: { id: myId, name: myPlayer.name, icon: myPlayer.icon, x: myPlayer.x, y: myPlayer.y, score: myPlayer.score }
                    });
                }
                myPlayer.lastSendTime = Date.now();
            }

            // เช็คการเก็บขยะ
            for (const [trashId, trash] of Object.entries(trashItems)) {
                const dist = Math.sqrt(Math.pow(myPlayer.x - trash.x, 2) + Math.pow(myPlayer.y - trash.y, 2));
                if (dist < 35) {
                    myPlayer.score += trash.value;
                    document.getElementById('myPlayerScore').innerText = myPlayer.score;
                    
                    delete trashItems[trashId]; // ลบออกจากจอตัวเอง
                    
                    // ประกาศให้ทุกคนรู้ว่าฉันเก็บชิ้นนี้ไปแล้ว (และอัปเดตคะแนนตัวเองให้คนอื่นรู้)
                    if (gameChannel) {
                        gameChannel.send({ type: 'broadcast', event: 'trash_collected', payload: { trashId: trashId } });
                        gameChannel.send({ type: 'broadcast', event: 'score_update', payload: { id: myId, score: myPlayer.score } });
                    }
                    updateLeaderboard();
                    break; 
                }
            }

            // ลบผู้เล่นที่ค้าง (ไม่ได้ส่งข้อมูลมาเกิน 5 วินาที)
            const now = Date.now();
            for (const [id, p] of Object.entries(otherPlayers)) {
                if (now - p.lastUpdate > 5000) {
                    delete otherPlayers[id];
                    updateLeaderboard();
                }
            }
        }

        function spawnTrash() {
            if (!isGameRunning) return;
            
            // เพื่อไม่ให้โหลดหนักเกินไป ให้สุ่มแค่บางครั้ง (จำลองว่าระบบช่วยกันเสกขยะ)
            if (Object.keys(trashItems).length < 20 && Math.random() < 0.3) {
                const rType = trashTypes[Math.floor(Math.random() * trashTypes.length)];
                const trashId = 't_' + Math.random().toString(36).substr(2, 9); // สุ่มไอดี
                
                const newTrash = {
                    id: trashId,
                    x: 50 + Math.random() * (canvasWidth - 100),
                    y: 50 + Math.random() * (canvasHeight - 100),
                    icon: rType.icon,
                    value: rType.value
                };
                
                trashItems[trashId] = newTrash; // ใส่ในจอเรา
                
                // กระจายให้ทุกคนในห้องสร้างขยะชิ้นเดียวกัน
                if(gameChannel) {
                    gameChannel.send({ type: 'broadcast', event: 'trash_spawned', payload: newTrash });
                }
            }
            setTimeout(spawnTrash, 2000);
        }

        function updateLeaderboard() {
            let all = Object.values(otherPlayers);
            if (myPlayer) all.push({ ...myPlayer, id: myId, isMe: true });
            all.sort((a, b) => b.score - a.score);
            
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';
            
            all.slice(0, 5).forEach((p, i) => {
                const li = document.createElement('li');
                li.className = `flex justify-between items-center ${p.isMe ? 'text-yellow-300 font-bold bg-white/10 rounded px-1' : 'text-gray-200'}`;
                li.innerHTML = `
                    <span class="truncate w-full"><span class="w-6">${i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : '▪️'))}</span> ${p.icon} ${p.name || 'Unknown'}</span>
                    <span class="font-mono text-blue-300 ml-2">${p.score || 0}</span>
                `;
                listEl.appendChild(li);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            
            // วาดพื้นหลัง Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let x = 0; x <= canvasWidth; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
            for(let y = 0; y <= canvasHeight; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }

            // วาดเป้าหมาย
            if (targetX !== null && targetY !== null) {
                ctx.beginPath(); ctx.arc(targetX, targetY, 15, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(100, 255, 100, 0.5)'; ctx.stroke();
            }

            // วาดขยะ
            ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (const trash of Object.values(trashItems)) {
                ctx.fillText(trash.icon, trash.x, trash.y + Math.sin(Date.now()/200)*3); // ให้ขยะเด้งๆ
            }

            // วาดผู้เล่นคนอื่น
            for (const p of Object.values(otherPlayers)) {
                if(p.x && p.y) drawPlayer(p.x, p.y, p.icon, p.name, false);
            }

            // วาดตัวเอง
            if (myPlayer) drawPlayer(myPlayer.x, myPlayer.y, myPlayer.icon, myPlayer.name, true);
        }

        function drawPlayer(x, y, icon, name, isMe) {
            ctx.beginPath(); ctx.ellipse(x, y + 25, 20, 8, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill(); // เงา
            ctx.font = 'bold 16px Kanit'; ctx.fillStyle = isMe ? '#fbbf24' : '#e2e8f0'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
            ctx.strokeText(name, x, y - 35); ctx.fillText(name, x, y - 35); // ชื่อ
            
            ctx.font = '40px Arial';
            let bob = isMe && (keys.w||keys.a||keys.s||keys.d||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||targetX) ? Math.sin(Date.now()/100)*4 : 0;
            ctx.fillText(icon, x, y + bob);
        }

        function gameLoop() {
            if (!isGameRunning) return;
            updateGameLogic();
            draw();
            requestAnimationFrame(gameLoop);
        }

        document.getElementById('joinButton').addEventListener('click', async () => {
            // 👇 1. นำ URL จาก Supabase มาวางในเครื่องหมายคำพูดด้านล่าง
            const url = "https://wsqnuyqbapbtbdpefaou.supabase.co";
            
            // 👇 2. นำ Anon Key จาก Supabase มาวางในเครื่องหมายคำพูดด้านล่าง
            const key = "sb_publishable_V3eajXxKGTh7JR2qXMFvCQ_6DT9UhgH";
            
            const name = document.getElementById('playerNameInput').value.trim();
            
            if (!name) {
                alert("กรุณาตั้งชื่อตัวละครก่อนครับ");
                return;
            }

            const btn = document.getElementById('joinButton');
            btn.innerText = 'กำลังเชื่อมต่อ...'; btn.disabled = true;

            // เชื่อมต่อ Supabase
            const connected = await setupSupabase(url, key);
            if (!connected) {
                alert("เชื่อมต่อไม่สำเร็จ กรุณาเช็ค URL และ Key");
                btn.innerText = 'เข้าเกม 🚀'; btn.disabled = false;
                return;
            }

            // เตรียมตัวละครตัวเอง
            myPlayer = {
                name: name,
                icon: characterIcons[Math.floor(Math.random() * characterIcons.length)],
                x: canvasWidth / 2, y: canvasHeight / 2,
                score: 0,
                lastSendTime: 0
            };

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.getElementById('uiOverlay').classList.remove('hidden');
            
            document.getElementById('myPlayerName').innerText = `${myPlayer.icon} ${myPlayer.name}`;
            updateLeaderboard();

            // บอกให้ทุกคนรู้ว่าเราเข้ามา
            gameChannel.send({ type: 'broadcast', event: 'player_moved', payload: { id: myId, name: myPlayer.name, icon: myPlayer.icon, x: myPlayer.x, y: myPlayer.y, score: 0 } });

            isGameRunning = true;
            spawnTrash();
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
